<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>画面幅の診断 — testfix</title>
<style>
  body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
       margin:0;padding:1.2rem;background:#faf7f2;color:#2b2b2b;line-height:1.7}
  h1{font-size:1.05rem;margin:0 0 .8rem}
  .big{font-size:2.6rem;font-weight:900;color:#6d28d9;line-height:1.1;margin:.2rem 0 .1rem}
  .sub{font-size:.85rem;color:#666;margin-bottom:1rem}
  table{border-collapse:collapse;width:100%;font-size:.9rem;background:#fff;border-radius:10px;overflow:hidden}
  th,td{border:1px solid #e5e0d8;padding:.5rem .6rem;text-align:left}
  th{background:#f3efe8;width:52%;font-weight:600}
  td{font-variant-numeric:tabular-nums}
  .ok{color:#059669;font-weight:800}
  .ng{color:#b91c1c;font-weight:800}
  .box{background:#fff;border:1px solid #e5e0d8;border-radius:10px;padding:.9rem 1rem;margin:1rem 0}
  .note{font-size:.8rem;color:#666;margin-top:1rem}
  #probe-date{display:block;background:#fee;padding:.5rem;border-radius:8px}
  #probe-ymd{display:none;background:#efe;padding:.5rem;border-radius:8px}
  @media(min-width:769px) and (max-width:1024px){
    #probe-date{display:none}
    #probe-ymd{display:block}
  }
</style>
</head>
<body>
<h1>📐 このタブレットの画面幅 診断</h1>
<div class="big" id="vw">—</div>
<div class="sub">↑ この数字を教えてください（CSSピクセル幅）</div>

<div class="box">
  <div id="probe-date">現在の表示：<b>カレンダー（type=date）</b>（769〜1024pxの範囲外）</div>
  <div id="probe-ymd">現在の表示：<b>3分割セレクト</b>（769〜1024pxの範囲内）</div>
</div>

<table id="t"></table>

<div class="box">
  <div style="font-size:.9rem;font-weight:700;margin-bottom:.4rem">向きを変えて再確認</div>
  <div style="font-size:.85rem;color:#555">タブレットを縦・横それぞれにして、上の大きな数字がいくつになるか両方教えてください。数字は自動で更新されます。</div>
</div>

<div class="note">このページは診断専用です。命盤計算やサイト本体には一切影響しません。</div>

<script>
function render(){
  var mq='(min-width:769px) and (max-width:1024px)';
  var rows=[
    ['window.innerWidth', window.innerWidth+' px'],
    ['documentElement.clientWidth', document.documentElement.clientWidth+' px'],
    ['screen.width', screen.width+' px'],
    ['devicePixelRatio', window.devicePixelRatio],
    ['画面の向き', (window.innerWidth>window.innerHeight)?'横向き':'縦向き'],
    ['innerHeight', window.innerHeight+' px'],
    ['769〜1024px に該当するか',
      (window.matchMedia(mq).matches?'<span class="ok">はい（3分割が出る）</span>':'<span class="ng">いいえ（カレンダーのまま）</span>')],
    ['visualViewport 幅', (window.visualViewport?Math.round(window.visualViewport.width)+' px':'—')],
    ['ズーム倍率の目安', (window.visualViewport?(window.visualViewport.scale||1):'—')],
    ['User Agent', navigator.userAgent]
  ];
  var h='';
  for(var i=0;i<rows.length;i++) h+='<tr><th>'+rows[i][0]+'</th><td>'+rows[i][1]+'</td></tr>';
  document.getElementById('t').innerHTML=h;
  document.getElementById('vw').textContent=document.documentElement.clientWidth+' px';
}
render();
window.addEventListener('resize',render);
window.addEventListener('orientationchange',function(){setTimeout(render,300);});
</script>
</body>
</html>
